services:
  - type: web
    name: birthchart-app
    env: python
    buildCommand: >
      cd frontend-src &&
      npm install &&
      npm run build &&
      cp -r build ../deploy/backend/build &&
      cd ../deploy/backend &&
      pip install -r requirements.txt
    startCommand: cd deploy/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false